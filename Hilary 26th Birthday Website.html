  <style>
    :root {
      --cream:       #FBF6EE;
      --cream-deep:  #F3EBDD;
      --blush:       #F3D9CE;
      --rose-dust:   #D9A89A;
      --taupe:       #7A5A4F;
      --ink:         #2B1F1A;
      --gold:        #B8893E;
      --gold-soft:   #D4B179;
      --champagne:   #E8D2A8;
      --glass-fill:  rgba(251,246,238,0.62);
      --glass-edge:  rgba(255,255,255,0.55);
      --hairline:    rgba(43,31,26,0.08);
      --bg:          var(--cream);
      --bg-alt:      var(--cream-deep);
      --fg-1:        var(--ink);
      --fg-2:        var(--taupe);
      --fg-3:        #A38A7E;
      --accent:      var(--gold);
      --accent-soft: var(--blush);
      --font-display:'Cormorant Garamond','Cormorant',Georgia,serif;
      --font-body:   'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --font-hand:   'Caveat','Bradley Hand',cursive;
      --t-hero:    clamp(64px,9vw,144px);
      --t-display: clamp(48px,6vw,96px);
      --t-h1:      clamp(36px,4vw,64px);
      --t-h2:      clamp(28px,3vw,44px);
      --t-h3:      22px; --t-lead: 20px; --t-body: 17px; --t-small: 14px; --t-caption: 12px;
      --leading-display:1.05; --leading-body:1.6; --leading-tight:1.25;
      --tracking-tight:-0.02em; --tracking-normal:0; --tracking-wide:0.08em; --tracking-caps:0.16em;
      --s-1:4px;--s-2:8px;--s-3:16px;--s-4:24px;--s-5:32px;--s-6:48px;--s-7:64px;--s-8:96px;--s-9:128px;--s-10:160px;
      --gutter:clamp(48px,8vw,160px);
      --r-pill:999px;--r-card:20px;--r-modal:28px;--r-photo:4px;--r-input:14px;
      --shadow-soft:0 8px 24px -12px rgba(122,90,79,0.18);
      --shadow-lift:0 24px 60px -24px rgba(122,90,79,0.28);
      --shadow-glow:0 0 48px -8px rgba(184,137,62,0.25);
      --shadow-photo:0 12px 28px -16px rgba(43,31,26,0.35);
      --ease:cubic-bezier(0.22,1,0.36,1);
      --ease-soft:cubic-bezier(0.4,0,0.2,1);
      --d-fast:250ms;--d-base:600ms;--d-slow:900ms;--d-cinema:1200ms;
    }
    *{box-sizing:border-box;}
    html,body{background:var(--bg);color:var(--fg-1);font-family:var(--font-body);font-size:var(--t-body);line-height:var(--leading-body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;margin:0;overflow-x:hidden;}
    h1,.h1,h2,.h2,h3,.h3{font-family:var(--font-display);font-weight:400;line-height:var(--leading-display);letter-spacing:var(--tracking-tight);color:var(--fg-1);margin:0;}
    p{font-size:var(--t-body);color:var(--fg-2);margin:0 0 var(--s-4);}
    body::-webkit-scrollbar{width:0;}

    @keyframes caretBlink{0%,50%{opacity:1;}51%,100%{opacity:0;}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
    @keyframes boxWiggle{0%{transform:rotate(0deg) translateY(0);}12%{transform:rotate(-4deg) translateY(-3px);}28%{transform:rotate(5deg) translateY(-2px);}44%{transform:rotate(-3.5deg) translateY(-1px);}62%{transform:rotate(2.5deg) translateY(0);}80%{transform:rotate(-1.5deg) translateY(0);}100%{transform:rotate(0deg) translateY(0);}}
    @keyframes boxFloat{0%{transform:translateY(0);}40%{transform:translateY(-12px);}100%{transform:translateY(-8px);}}
    @keyframes boxBreathe{0%,100%{transform:translateY(0);}50%{transform:translateY(-2px);}}
    @keyframes boxShakeHard{0%{transform:rotate(0deg) translateY(0);}8%{transform:rotate(-7deg) translate(-3px,-4px);}18%{transform:rotate(8deg) translate(4px,-3px);}30%{transform:rotate(-6deg) translate(-2px,-2px);}44%{transform:rotate(6deg) translate(3px,-1px);}60%{transform:rotate(-3deg) translateY(0);}78%{transform:rotate(2deg) translateY(0);}100%{transform:rotate(0deg) translateY(0);}}
    @keyframes shimmer{0%,100%{opacity:0.6;}50%{opacity:1;}}

    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:100;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.17  0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0.5 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");
      opacity:0.035;mix-blend-mode:multiply;}

    /* Tweaks panel */
    .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:rgba(250,249,247,.78);color:#29261b;-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:.5px solid rgba(255,255,255,.6);border-radius:14px;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden;}
    .twk-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 14px;cursor:move;user-select:none;}
    .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em;}
    .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1;}
    .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b;}
    .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent;}
    .twk-row{display:flex;flex-direction:column;gap:5px;}
    .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;}
    .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72);}
    .twk-lbl>span:first-child{font-weight:500;}
    .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(41,38,27,.45);padding:10px 0 0;}
    .twk-sect:first-child{padding-top:0;}
    .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.06);user-select:none;}
    .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s;}
    .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;border-radius:6px;cursor:default;padding:4px 6px;line-height:1.2;overflow-wrap:anywhere;}
    .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0;}
    .twk-toggle[data-on="1"]{background:#34c759;}
    .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s;}
    .twk-toggle[data-on="1"] i{transform:translateX(14px);}
    .twk-field{appearance:none;width:100%;height:26px;padding:0 8px;border:.5px solid rgba(0,0,0,.1);border-radius:7px;background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none;}
    select.twk-field{padding-right:22px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");background-repeat:no-repeat;background-position:right 8px center;}
  </style>

  <script src="react-dom.min.js"></script>
  <script src="babel.min.js"></script>
  <script>
    window._bgAudio = new Audio('Best Part.mp3');
    window._bgAudio.loop = true;
    window._bgAudio.volume = 0.35;
    window._bgListeners = [];
    window._bgStarted = false;

    document.addEventListener('click', function startBg() {
      if (!window._bgStarted) {
        window._bgStarted = true;
        window._bgAudio.play().then(function() {
          window._bgListeners.forEach(function(fn){ fn(true); });
        }).catch(function(){});
      }
    }, { passive: true });
  </script>
</head>
<body>
  <div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── SHARED ATOMS ─────────────────────────────────────────── */

function Monogram({ size = 24 }) {
  return (
    <span style={{ fontFamily:"'Cormorant Garamond',serif", fontStyle:'italic', fontWeight:400, fontSize:size, color:'var(--ink)', letterSpacing:'-0.02em', lineHeight:1 }}>h.</span>
  );
}

function Button({ children, variant = 'default', onClick, style = {} }) {
  const [hover, setHover] = useState(false);
  const base = {
    display:'inline-flex', alignItems:'center', gap:10, padding:'14px 30px',
    fontFamily:"'Inter',sans-serif", fontSize:14, fontWeight:500, letterSpacing:'0.02em',
    border:'1px solid var(--hairline)', borderRadius:999, cursor:'pointer',
    transition:'all 320ms cubic-bezier(0.22,1,0.36,1)',
    background:'var(--cream)', color:'var(--ink)',
    boxShadow: hover ? '0 0 56px -8px rgba(184,137,62,0.45),0 8px 18px -10px rgba(122,90,79,0.25)' : 'none',
    transform: hover ? 'translateY(-1px)' : 'translateY(0)',
    ...style,
  };
  const variants = {
    primary:{ background:'var(--ink)',  color:'var(--cream)', border:'1px solid transparent' },
    gold:   { background:'var(--gold)', color:'var(--cream)', border:'1px solid transparent' },
    ghost:  { background:'transparent', border:'1px solid var(--hairline)' },
  };
  return (
    <button onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)} onClick={onClick}
            style={{...base,...(variants[variant]||{})}}>{children}</button>
  );
}

function TopNav({ current, onGo }) {
  const items = [
    {id:'present', label:'Home'},{id:'memories',label:'Memories'},
    {id:'reasons', label:'Reasons'},{id:'letter',label:'Letter'},
    {id:'hunt',    label:'Find me', accent:true},
  ];
  return (
    <div style={{ position:'fixed', top:28, left:0, right:0, display:'flex', justifyContent:'space-between', alignItems:'center', padding:'0 40px', zIndex:50, pointerEvents:'none' }}>
      <div style={{pointerEvents:'auto'}}><Monogram /></div>
      <div style={{ pointerEvents:'auto', display:'flex', alignItems:'center', gap:4, padding:6, background:'rgba(251,246,238,0.62)', backdropFilter:'blur(20px) saturate(120%)', WebkitBackdropFilter:'blur(20px) saturate(120%)', border:'1px solid rgba(255,255,255,0.55)', borderRadius:999, boxShadow:'0 8px 24px -12px rgba(122,90,79,0.18)' }}>
        {items.map(it=>{
          const active = current===it.id;
          return (
            <button key={it.id} onClick={()=>onGo(it.id)} style={{ padding:'10px 18px', border:'none', cursor:'pointer', fontFamily:"'Inter',sans-serif", fontSize:13, fontWeight:500, letterSpacing:'0.02em', borderRadius:999, transition:'all 280ms cubic-bezier(0.22,1,0.36,1)', background:active?'var(--ink)':'transparent', color:active?'var(--cream)':(it.accent?'var(--gold)':'var(--ink)') }}>{it.label}</button>
          );
        })}
      </div>
      <div style={{pointerEvents:'auto',width:24}} />
    </div>
  );
}

function PageHelpers({ index, total, helperText='' }) {
  return (
    <>
      <div style={{ position:'fixed', left:40, bottom:28, zIndex:50, fontFamily:"'Inter',sans-serif", fontSize:11, color:'var(--fg-3)', letterSpacing:'0.14em', textTransform:'uppercase', display:'flex', alignItems:'center', gap:10 }}>
        {helperText.split('→')[0]}
        <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:14, color:'var(--ink)', textTransform:'none', letterSpacing:0 }}>→</span>
      </div>
      <div style={{ position:'fixed', right:40, bottom:28, zIndex:50, fontFamily:"'Inter',sans-serif", fontSize:11, color:'var(--fg-3)', letterSpacing:'0.14em' }}>
        {String(index).padStart(2,'0')} <span style={{opacity:0.5}}>/</span> {String(total).padStart(2,'0')}
      </div>
    </>
  );
}

function Eyebrow({ children, style={} }) {
  return <div style={{ fontFamily:"'Inter',sans-serif", fontSize:11, letterSpacing:'0.22em', textTransform:'uppercase', color:'var(--fg-3)', ...style }}>{children}</div>;
}

function Reveal({ children, delay=0, y=24, duration=1100 }) {
  const [shown,setShown] = useState(false);
  useEffect(()=>{ const t=setTimeout(()=>setShown(true),delay); return ()=>clearTimeout(t); },[delay]);
  return (
    <div style={{ opacity:shown?1:0, transform:`translateY(${shown?0:y}px)`, transition:`opacity ${duration}ms cubic-bezier(0.22,1,0.36,1),transform ${duration}ms cubic-bezier(0.22,1,0.36,1)` }}>{children}</div>
  );
}

function Typewriter({ text, speed=48, onDone }) {
  const [shown,setShown] = useState('');
  const [done,setDone]   = useState(false);
  useEffect(()=>{
    setShown(''); setDone(false);
    let i=0;
    const id=setInterval(()=>{ i++; setShown(text.slice(0,i)); if(i>=text.length){clearInterval(id);setDone(true);if(onDone)onDone();} },speed);
    return ()=>clearInterval(id);
  },[text,speed]);
  return (
    <span>
      {shown}
      <span style={{ display:'inline-block', width:2, height:'0.85em', background:'currentColor', marginLeft:3, verticalAlign:'text-bottom', opacity:done?0:1, animation:'caretBlink 900ms steps(2) infinite', transition:'opacity 700ms' }} />
    </span>
  );
}

function SectionTitle({ chapter, title, italicTail, sub }) {
  return (
    <div style={{textAlign:'center',marginBottom:32}}>
      <Reveal delay={150}><Eyebrow>Chapter {chapter}</Eyebrow></Reveal>
      <Reveal delay={350}>
        <h2 style={{ fontFamily:"'Cormorant Garamond',serif", fontWeight:400, fontSize:'clamp(44px,5.5vw,80px)', letterSpacing:'-0.02em', lineHeight:1.22, color:'var(--ink)', margin:'14px 0 28px', paddingBottom:6, maxWidth:'20ch' }}>
          {title}{italicTail&&<> <span style={{fontStyle:'italic',whiteSpace:'nowrap'}}>{italicTail}</span></>}
        </h2>
      </Reveal>
      {sub&&<Reveal delay={650}><p style={{ fontFamily:"'Inter',sans-serif", fontSize:16, color:'var(--taupe)', maxWidth:480, margin:'0 auto', lineHeight:1.6 }}>{sub}</p></Reveal>}
    </div>
  );
}

/* ─── TWEAKS PANEL ──────────────────────────────────────────── */

function useTweaks(defaults) {
  const [values,setValues] = React.useState(defaults);
  const setTweak = React.useCallback((k,v)=>{
    const edits = typeof k==='object'&&k!==null ? k : {[k]:v};
    setValues(prev=>({...prev,...edits}));
  },[]);
  return [values,setTweak];
}

function TweaksPanel({ title='Tweaks', children }) {
  const [open,setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({x:16,y:16});
  const PAD=16;
  const clamp = React.useCallback(()=>{
    const p=dragRef.current; if(!p) return;
    const maxR=Math.max(PAD,window.innerWidth-p.offsetWidth-PAD);
    const maxB=Math.max(PAD,window.innerHeight-p.offsetHeight-PAD);
    offsetRef.current={x:Math.min(maxR,Math.max(PAD,offsetRef.current.x)),y:Math.min(maxB,Math.max(PAD,offsetRef.current.y))};
    p.style.right=offsetRef.current.x+'px'; p.style.bottom=offsetRef.current.y+'px';
  },[]);
  React.useEffect(()=>{ if(!open) return; clamp(); const ro=new ResizeObserver(clamp); ro.observe(document.documentElement); return()=>ro.disconnect(); },[open,clamp]);
  React.useEffect(()=>{
    const h=e=>{const t=e?.data?.type; if(t==='__activate_edit_mode')setOpen(true); else if(t==='__deactivate_edit_mode')setOpen(false);};
    window.addEventListener('message',h);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return ()=>window.removeEventListener('message',h);
  },[]);
  const onDragStart=e=>{
    const p=dragRef.current; if(!p) return;
    const r=p.getBoundingClientRect();
    const sr=window.innerWidth-r.right, sb=window.innerHeight-r.bottom, sx=e.clientX, sy=e.clientY;
    const mv=ev=>{offsetRef.current={x:sr-(ev.clientX-sx),y:sb-(ev.clientY-sy)};clamp();};
    const up=()=>{window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);};
    window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up);
  };
  if(!open) return null;
  return (
    <div ref={dragRef} className="twk-panel" style={{right:offsetRef.current.x,bottom:offsetRef.current.y}}>
      <div className="twk-hd" onMouseDown={onDragStart}>
        <b>{title}</b>
        <button className="twk-x" onMouseDown={e=>e.stopPropagation()} onClick={()=>setOpen(false)}>✕</button>
      </div>
      <div className="twk-body">{children}</div>
    </div>
  );
}

function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }

function TweakRow({ label, children, inline=false }) {
  return (
    <div className={inline?'twk-row twk-row-h':'twk-row'}>
      <div className="twk-lbl"><span>{label}</span></div>
      {children}
    </div>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value?'1':'0'} onClick={()=>onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging,setDragging] = React.useState(false);
  const valueRef = React.useRef(value); valueRef.current=value;
  const labelLen=o=>String(typeof o==='object'?o.label:o).length;
  const maxLen=options.reduce((m,o)=>Math.max(m,labelLen(o)),0);
  const fitsAsSegments=maxLen<=({2:16,3:10}[options.length]??0);
  if(!fitsAsSegments){
    return (
      <TweakRow label={label}>
        <select className="twk-field" value={value} onChange={e=>onChange(e.target.value)}>
          {options.map(o=>{const v=typeof o==='object'?o.value:o;return <option key={v} value={v}>{v}</option>;})}
        </select>
      </TweakRow>
    );
  }
  const opts=options.map(o=>typeof o==='object'?o:{value:o,label:o});
  const idx=Math.max(0,opts.findIndex(o=>o.value===value));
  const n=opts.length;
  const segAt=cx=>{const r=trackRef.current.getBoundingClientRect();const i=Math.floor(((cx-r.left-2)/(r.width-4))*n);return opts[Math.max(0,Math.min(n-1,i))].value;};
  const onPointerDown=e=>{
    setDragging(true);
    const v0=segAt(e.clientX); if(v0!==valueRef.current)onChange(v0);
    const mv=ev=>{if(!trackRef.current)return;const v=segAt(ev.clientX);if(v!==valueRef.current)onChange(v);};
    const up=()=>{setDragging(false);window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);};
    window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
  };
  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown} className={dragging?'twk-seg dragging':'twk-seg'}>
        <div className="twk-seg-thumb" style={{left:`calc(2px + ${idx} * (100% - 4px) / ${n})`,width:`calc((100% - 4px) / ${n})`}} />
        {opts.map(o=><button key={o.value} type="button" role="radio" aria-checked={o.value===value}>{o.label}</button>)}
      </div>
    </TweakRow>
  );
}

/* ─── CHAPTER 1: PRESENT ────────────────────────────────────── */

const FINISHES = {
  rose:   { body:{f:['#EBC2B2','#D8A595','#B07F70'],s:['#A57464','#7E5648'],t:['#F4D2C3','#D9A89A']}, lid:{f:['#F4D2C3','#C99183'],s:['#B58775','#8E6253'],t:['#FBE4D6','#E8C5B5']}, bgGrad:'radial-gradient(ellipse at 50% 42%, #F8E6DD 0%, #F3D9CE 55%, #E8C2B4 100%)' },

function PresentChapter({ onNext }) {
  const [t,setTweak]=useTweaks({boxFinish:'rose',ribbonColor:'gold',shake:'gentle',monogramOnLid:true,ambientGlow:true});
  const [wk,setWk]=useState(0);
  const [opening,setOpening]=useState(false);
  const [opened,setOpened]=useState(false);
  const [taps,setTaps]=useState(0);
  const tap=()=>{
    if(opening)return;
    const n=taps+1; setTaps(n); setWk(k=>k+1);
    if(n>=2){setTimeout(()=>{setOpening(true);setTimeout(()=>setOpened(true),1100);setTimeout(()=>onNext(),1500);},250);}
  };
  const F=FINISHES[t.boxFinish]||FINISHES.rose;
  return (
    <section style={{ minHeight:'100vh', background:F.bgGrad, transition:'background 900ms', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', position:'relative', padding:'clamp(44px,5vh,80px) 24px clamp(28px,3vh,50px)' }}>
      <Reveal delay={100}><Eyebrow style={{marginBottom:14,color:'var(--taupe)'}}>may · ninth · two&nbsp;thousand&nbsp;twenty&nbsp;six</Eyebrow></Reveal>
      <Reveal delay={400} duration={1300}>
        <h1 style={{ fontFamily:"'Cormorant Garamond',serif", fontWeight:300, fontSize:'clamp(40px,5.5vw,88px)', letterSpacing:'-0.025em', lineHeight:1.2, color:'var(--ink)', textAlign:'center', margin:'0 0 22px', paddingBottom:6 }}>
          Happy birthday,<br/><span style={{fontStyle:'italic',fontWeight:400}}>baby g.</span>
        </h1>
      </Reveal>
      <Reveal delay={1100}><p style={{ fontFamily:"'Cormorant Garamond',serif", fontStyle:'italic', fontSize:18, color:'var(--taupe)', maxWidth:420, textAlign:'center', margin:'0 0 22px', lineHeight:1.4 }}>I made you something. Tap, when you're ready.</p></Reveal>
      <Reveal delay={1600}>
        <div onClick={tap} style={{cursor:opening?'default':'pointer'}}>
          <PresentBox3D wiggle={wk} opening={opening} opened={opened} finish={t.boxFinish} ribbon={t.ribbonColor} shakeKf={SHAKE[t.shake]?.kf||null} monogramOnLid={t.monogramOnLid} ambientGlow={t.ambientGlow}/>
        </div>
      </Reveal>
      <div style={{
        marginTop:24,
        fontFamily: taps>0 ? "'Cormorant Garamond',serif" : "'Inter',sans-serif",
        fontStyle: taps>0 ? 'italic' : 'normal',
        fontSize: taps>0 ? 22 : 11,
        letterSpacing: taps>0 ? '0.04em' : '0.18em',
        textTransform: taps>0 ? 'none' : 'uppercase',
        color: taps>0 ? 'var(--gold)' : 'var(--fg-3)',
        opacity: opening ? 0 : 1,
        transition:'all 500ms cubic-bezier(0.22,1,0.36,1)',
        animation: taps>0 ? 'shimmer 1200ms ease-in-out infinite' : 'shimmer 2400ms ease-in-out infinite',
      }}>
        {taps===0 ? 'tap to begin' : 'once more —'}
      </div>
      <TweaksPanel>
        <TweakSection label="The box"/>
        <TweakRadio label="Finish" value={t.boxFinish} options={['rose','velvet','cream','ink']} onChange={v=>setTweak('boxFinish',v)}/>
        <TweakRadio label="Ribbon" value={t.ribbonColor} options={['gold','champagne','ink','blush']} onChange={v=>setTweak('ribbonColor',v)}/>
        <TweakSection label="Motion"/>
        <TweakRadio label="Shake" value={t.shake} options={['none','gentle','strong']} onChange={v=>setTweak('shake',v)}/>
        <TweakToggle label="Foil monogram" value={t.monogramOnLid} onChange={v=>setTweak('monogramOnLid',v)}/>
        <TweakToggle label="Ambient glow" value={t.ambientGlow} onChange={v=>setTweak('ambientGlow',v)}/>
      </TweaksPanel>
    </section>
  );
}

        <Reveal delay={300}><div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:48,color:'var(--gold)',marginBottom:24}}>✦</div></Reveal>
        <Reveal delay={600}><h2 style={{fontFamily:"'Cormorant Garamond',serif",fontWeight:300,fontSize:'clamp(56px,7vw,112px)',letterSpacing:'-0.025em',lineHeight:1.05,color:'var(--ink)',margin:'0 0 24px'}}>You found it.</h2></Reveal>
        <Reveal delay={900}><p style={{fontFamily:"'Cormorant Garamond',serif",fontStyle:'italic',fontSize:26,color:'var(--taupe)',maxWidth:480,margin:'0 0 56px'}}>I knew you would.</p></Reveal>
        <Reveal delay={1200}><div style={{fontFamily:"'Caveat',cursive",fontSize:36,color:'var(--gold)',marginBottom:56}}>— happy birthday, my love. ♡</div></Reveal>
        <Reveal delay={1500}><Button onClick={onRestart} variant="ghost">Start again</Button></Reveal>
      </div>}
    </section>
  );
}

/* ─── MUSIC BUTTON ─────────────────────────────────────────── */

function MusicButton() {
  const [playing, setPlaying] = React.useState(false);
  const [visible, setVisible] = React.useState(false);

  React.useEffect(() => {
    const listener = (state) => { setPlaying(state); setVisible(true); };
    window._bgListeners = window._bgListeners || [];
    window._bgListeners.push(listener);
    return () => { window._bgListeners = window._bgListeners.filter(l => l !== listener); };
  }, []);

  const toggle = () => {
    const audio = window._bgAudio;
    if (!audio) return;
    if (playing) {
      audio.pause();
      setPlaying(false);
    } else {
      audio.play().then(() => setPlaying(true)).catch(() => {});
    }
  };

  return (
    <button onClick={toggle} title={playing ? 'Pause music' : 'Play music'} style={{
      position: 'fixed', bottom: 28, left: '50%', transform: 'translateX(-50%)',
      zIndex: 50, background: 'transparent', border: 'none', cursor: 'pointer',
      fontFamily: "'Cormorant Garamond', serif",
      fontSize: 18, color: 'var(--fg-3)',
      opacity: visible ? 0.7 : 0,
      transition: 'opacity 800ms, color 250ms',
      display: 'flex', alignItems: 'center', gap: 6, padding: '4px 8px',
      letterSpacing: '0.06em',
    }}
    onMouseEnter={e => e.currentTarget.style.color = 'var(--gold)'}
    onMouseLeave={e => e.currentTarget.style.color = 'var(--fg-3)'}>
      <span style={{
        display: 'inline-block',
        animation: playing ? 'shimmer 1800ms ease-in-out infinite' : 'none',
      }}>{playing ? '♫' : '♪'}</span>
    </button>
  );
}

/* ─── APP ROOT ──────────────────────────────────────────────── */

const ORDER = ['present','memories','reasons','letter','hunt'];
const HELPERS = {present:'Tap the present, or press →',memories:'Hover the photos · then →',reasons:'Click a card to turn it · then →',letter:'Read slowly · then →',hunt:'Solve the clue · then find me'};

function App() {
  const [chapter,setChapter]=useState('present');
  const go=id=>{ if(!ORDER.includes(id))return; setChapter(id); window.scrollTo({top:0,behavior:'smooth'}); };
  const next=()=>{ const i=ORDER.indexOf(chapter); if(i<ORDER.length-1)go(ORDER[i+1]); };
  useEffect(()=>{
    const h=e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft'){const i=ORDER.indexOf(chapter);if(i>0)go(ORDER[i-1]);}};
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[chapter]);
  const idx=ORDER.indexOf(chapter)+1;
  return (
    <div style={{position:'relative',minHeight:'100vh',background:'var(--cream)'}}>
      <TopNav current={chapter} onGo={go}/>
      <div key={chapter} style={{animation:'fadeUp 1100ms cubic-bezier(0.22,1,0.36,1)'}}>
        {chapter==='present'  && <PresentChapter  onNext={next}/>}
        {chapter==='memories' && <MemoriesChapter onNext={next}/>}
        {chapter==='reasons'  && <ReasonsChapter  onNext={next}/>}
        {chapter==='letter'   && <LetterChapter   onNext={next}/>}
        {chapter==='hunt'     && <HuntChapter     onRestart={()=>go('present')}/>}
      </div>
      <PageHelpers index={idx} total={ORDER.length} helperText={HELPERS[chapter]}/>
      <MusicButton/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
